{% extends 'base.html' %}

{% block title %}Taking Quiz: {{ arena.name }} - QuestAI{% endblock %}

{% block content %}
<div class="w-full space-y-6 pb-16">

    <!-- JSON Data for React Quiz Runner -->
    <script id="quiz-questions-data" type="application/json">
        {{ questions_json|safe }}
    </script>

    <!-- React Quiz Runner Mount Node -->
    <div id="react-quiz-runner"
        data-arena-name="{{ arena.name }}"
        data-arena-id="{{ arena.id }}"
        data-attempt-id="{{ attempt.id }}"
        data-csrf-token="{{ csrf_token }}"
        data-submit-url="{% url 'quizzes:submit' attempt.id %}"
        data-exit-url="{% url 'arenas:detail' arena.id %}">
    </div>

    <!-- Progressive Enhancement Fallback (shown if JavaScript is disabled) -->
    <noscript>
        <div class="space-y-6">
            <!-- Quiz Header -->
            <div class="rounded-xl border border-border bg-card p-4 flex items-center justify-between text-card-foreground">
                <div>
                    <span class="text-[10px] uppercase font-bold text-primary tracking-wider">Active Attempt</span>
                    <h2 class="text-base font-bold text-foreground">{{ arena.name }}</h2>
                </div>
                <span class="text-xs font-semibold text-muted-foreground">{{ answers.count }} Questions</span>
            </div>

            <!-- Quiz Taking Form -->
            <form id="fallbackQuizForm" method="POST" action="{% url 'quizzes:submit' attempt.id %}" class="space-y-6">
                {% csrf_token %}
                <input type="hidden" name="duration_seconds" value="60">

                {% for ans in answers %}
                {% with q=ans.question %}
                <div class="rounded-2xl border border-border bg-card p-6 space-y-4 text-card-foreground">
                    <div class="flex items-center justify-between">
                        <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-primary/10 text-primary">
                            Question {{ forloop.counter }} of {{ answers.count }}
                        </span>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-secondary text-secondary-foreground">
                            {{ q.get_question_type_display }}
                        </span>
                    </div>

                    <p class="text-base font-semibold text-foreground leading-relaxed">{{ q.question_text }}</p>

                    {% if q.is_mcq and q.options %}
                    <div class="space-y-2 pt-2">
                        {% for opt in q.options %}
                        <label class="flex items-center p-3 rounded-lg border border-border hover:bg-secondary cursor-pointer">
                            <input type="radio" name="question_{{ q.id }}" value="{{ opt }}" class="w-4 h-4 text-primary">
                            <span class="ml-3 text-sm text-foreground">{{ opt }}</span>
                        </label>
                        {% endfor %}
                    </div>
                    {% else %}
                    <div class="pt-2">
                        <textarea name="question_{{ q.id }}" rows="4" placeholder="Type your answer here..."
                            class="w-full px-4 py-3 rounded-xl border border-input bg-background text-foreground text-sm"></textarea>
                    </div>
                    {% endif %}
                </div>
                {% endwith %}
                {% endfor %}

                <div class="flex items-center justify-between pt-4 border-t border-border">
                    <a href="{% url 'arenas:detail' arena.id %}" class="text-xs font-medium text-muted-foreground hover:text-foreground">
                        Exit Quiz
                    </a>
                    <button type="submit" class="px-6 py-2 rounded-lg text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700">
                        Submit Quiz
                    </button>
                </div>
            </form>
        </div>
    </noscript>

</div>
{% endblock %}

{% block extra_js %}
<!-- React Component: QuizRunner -->
<script type="text/babel" src="/static/js/components/QuizRunner.jsx"></script>
{% endblock %}
