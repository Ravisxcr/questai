{% extends 'base.html' %}

{% block title %}Edit Arena - {{ arena.name }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-8">
    <div class="bg-card text-card-foreground rounded-xl border border-border shadow-sm p-6 sm:p-8 space-y-6">
        
        <div class="flex items-center space-x-3 pb-4 border-b border-border">
            <a href="{% url 'arenas:detail' arena.id %}" class="p-2 rounded-lg text-muted-foreground hover:text-foreground hover:bg-secondary transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-xl font-bold text-foreground">Edit Arena</h1>
                <p class="text-xs text-muted-foreground">Update title, description, or color theme.</p>
            </div>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-foreground uppercase tracking-wider mb-1.5">Arena Title *</label>
                {{ form.name }}
            </div>

            <div>
                <label class="block text-xs font-semibold text-foreground uppercase tracking-wider mb-1.5">Description</label>
                {{ form.description }}
            </div>

            <div>
                <label class="block text-xs font-semibold text-foreground uppercase tracking-wider mb-1.5">Color Accent</label>
                {{ form.color_theme }}
            </div>

            <div class="flex items-center justify-end space-x-2 pt-4 border-t border-border">
                <a href="{% url 'arenas:detail' arena.id %}" class="px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary transition-colors">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2 rounded-lg text-xs sm:text-sm font-semibold text-primary-foreground bg-primary hover:bg-primary/90 shadow-sm transition-all">
                    Save Changes
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
