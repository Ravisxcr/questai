{% extends 'base.html' %}

{% block title %}Edit Arena - {{ arena.name }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-8">
    <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 sm:p-8 space-y-6">
        
        <div class="flex items-center space-x-3 pb-4 border-b border-slate-100 dark:border-slate-700">
            <a href="{% url 'arenas:detail' arena.id %}" class="p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-xl font-bold text-slate-900 dark:text-white">Edit Arena</h1>
                <p class="text-xs text-slate-500">Update title, description, or color theme.</p>
            </div>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Arena Title *</label>
                {{ form.name }}
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Description</label>
                {{ form.description }}
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Color Accent</label>
                {{ form.color_theme }}
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                <a href="{% url 'arenas:detail' arena.id %}" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md shadow-indigo-600/20">
                    Save Changes
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
